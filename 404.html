<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página não encontrada · Casa do Ferreiro</title>
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2a2118">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Jost:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/base.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:var(--dark);color:var(--white);text-align:center}
.notfound{max-width:30rem}
.notfound .code{font-family:'Cormorant Garamond',serif;font-size:clamp(4rem,18vw,7rem);font-weight:300;color:var(--accent2);line-height:1}
.notfound h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.9rem;margin:.75rem 0}
.notfound p{color:var(--stone);line-height:1.7;margin-bottom:2rem}
.notfound a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:.9rem 1.8rem;border-radius:2px;font-size:.8rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.notfound a:hover{background:var(--accent2);color:var(--dark)}
</style>
</head>
<body>
<main class="notfound">
  <div class="code">404</div>
  <h1>Página não encontrada</h1>
  <p>A página que procura não existe ou mudou de endereço.<br><span lang="en">Page not found.</span> · <span lang="es">Página no encontrada.</span></p>
  <a href="/">Voltar à Casa do Ferreiro</a>
</main>
</body>
</html>
