name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare pages artifact
        run: |
          mkdir -p public
          cp index.html admin.html avaliacao.html 404.html robots.txt sitemap.xml .nojekyll public/
          cp -R assets public/
          # Versão nos links de CSS/JS: os browsers descarregam os ficheiros novos em cada publicação
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" public/*.html
          # Cópia das casas publicada com o site: aparece logo, mesmo com o servidor a acordar.
          # Opcional: se o servidor não responder, o site carrega as casas só do servidor.
          mkdir -p public/assets/data
          if curl -sf --retry 6 --retry-delay 10 --retry-all-errors --max-time 30               https://casadaserra-production.up.railway.app/api/rooms -o rooms.json               && node -e 'const r = require("./rooms.json"); if (!Array.isArray(r) || !r.length) process.exit(1)'; then
            mv rooms.json public/assets/data/rooms.json
          else
            echo "::warning::Não foi possível obter as casas do servidor; publicado sem cópia."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
