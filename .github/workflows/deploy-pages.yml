name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare pages artifact
        run: |
          mkdir -p public
          cp index.html admin.html 404.html robots.txt sitemap.xml .nojekyll public/
          cp -R assets public/
          # Versão nos links de CSS/JS: os browsers descarregam os ficheiros novos em cada publicação
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" public/*.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
